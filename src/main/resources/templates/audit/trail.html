<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Complete Audit Trail')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar('AUDIT')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('AUDIT','trail')}"></aside>
<main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Security</span><h1 class="page-title">Complete audit trail</h1><p class="page-subtitle">This ledger is loaded only when requested.</p></div><a class="btn btn-outline-success" th:href="@{/audit/report.csv(query=${query},action=${action})}">Export CSV</a></div>
<section class="surface-card"><div class="card-body"><form class="row g-2 mb-4" method="get" th:action="@{/audit/trail}"><div class="col-md-5"><input class="form-control" name="query" th:value="${query}" placeholder="Username, entity, or target ID"></div><div class="col-md-4"><input class="form-control" name="action" th:value="${action}" placeholder="Action type"></div><div class="col-md-3"><button class="btn btn-bank">Search</button></div></form>
<div class="table-responsive"><table class="table app-table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Target</th><th>IP</th><th>Result</th></tr></thead><tbody><tr th:each="log:${logs.content}"><td th:text="${log.eventTime}"></td><td th:text="${log.username?:'System'}"></td><td th:text="${log.actionType}"></td><td th:text="${log.targetEntity+' '+(log.targetId?:'')}"></td><td th:text="${log.ipAddress}"></td><td th:text="${log.result}"></td></tr><tr th:if="${#lists.isEmpty(logs.content)}"><td colspan="6">No matching events.</td></tr></tbody></table></div>
<nav class="d-flex justify-content-between"><a class="btn btn-sm btn-soft" th:classappend="${logs.first}?' disabled'" th:href="@{/audit/trail(query=${query},action=${action},page=${logs.number-1})}">Previous</a><span th:text="${'Page '+(logs.number+1)+' of '+(logs.totalPages==0?1:logs.totalPages)}"></span><a class="btn btn-sm btn-soft" th:classappend="${logs.last}?' disabled'" th:href="@{/audit/trail(query=${query},action=${action},page=${logs.number+1})}">Next</a></nav>
</div></section></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
