<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head(${title})}"></head><body>
<header th:replace="~{fragments/navbar :: navbar('AUDIT')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('AUDIT',${activePage})}"></aside>
<main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Audit report</span><h1 class="page-title" th:text="${title}"></h1></div><div class="d-flex gap-2"><a class="btn btn-soft" th:href="@{/audit/dashboard}">Back</a><a class="btn btn-outline-success" th:href="${'/audit/reports/'+reportType+'.csv'}">Export CSV</a></div></div>
<section class="surface-card"><div class="table-responsive">
<table class="table app-table" th:if="${reportType=='onboarding'}"><thead><tr><th>Employee</th><th>Onboarded</th><th>Initiated by</th><th>Source / Batch</th><th>DGM approval</th><th>GM approval</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.employeeName}"></strong><br><small th:text="${r.employeeNumber}"></small></td><td th:text="${r.onboardedAt}"></td><td th:text="${r.initiatedBy}"></td><td th:text="${r.source+(r.batchNumber==null?'':' / '+r.batchNumber)}"></td><td th:text="${(r.dgmApprovedBy?:'Not recorded')+(r.dgmApprovedAt==null?'':' / '+r.dgmApprovedAt)}"></td><td th:text="${(r.gmApprovedBy?:'Not recorded')+(r.gmApprovedAt==null?'':' / '+r.gmApprovedAt)}"></td></tr></tbody></table>
<table class="table app-table" th:if="${reportType=='signature-additions'}"><thead><tr><th>Employee</th><th>Type</th><th>Added by</th><th>Added at</th><th>Request</th></tr></thead><tbody><tr th:each="r:${rows}"><td><strong th:text="${r.employeeName}"></strong><br><small th:text="${r.employeeNumber}"></small></td><td th:text="${r.signatureType}"></td><td th:text="${r.addedBy}"></td><td th:text="${r.addedAt}"></td><td th:text="${r.requestNumber?:'Legacy/current record'}"></td></tr></tbody></table>
<table class="table app-table" th:if="${reportType=='signature-views'}"><thead><tr><th>Viewed by</th><th>When</th><th>Employee whose signature was viewed</th><th>Type</th><th>Result</th><th>IP</th></tr></thead><tbody><tr th:each="r:${rows}"><td th:text="${r.viewedBy}"></td><td th:text="${r.viewedAt}"></td><td><strong th:text="${r.employeeName?:'Unknown/legacy path'}"></strong><br><small th:text="${r.employeeNumber}"></small></td><td th:text="${r.signatureType}"></td><td th:text="${r.result}"></td><td th:text="${r.ipAddress}"></td></tr></tbody></table>
<div class="p-4 text-muted" th:if="${#lists.isEmpty(rows)}">No tracked records are available for this report yet.</div>
</div></section></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
