<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Signature Versions')}"></head>

<body>

<header th:replace="~{fragments/navbar :: navbar('PD')}"></header>

<aside th:replace="~{fragments/sidebar :: sidebar('PD','approved-signatures')}"></aside>

<main class="app-main">

    <div class="content-wrap">

        <!-- Page Header -->
        <div class="page-header">

            <div>

                <span class="page-eyebrow">
                    Approved Version History
                </span>

                <h1 class="page-title"
                    th:text="${employee.fullName}">
                    Employee
                </h1>

                <p class="page-subtitle">

                    <span th:text="${employee.employeeNumber}">
                    </span>

                    · Every GM-approved photo and signature version.

                </p>

            </div>

            <a class="btn btn-soft"
               th:href="@{/pd/approved-signatures}">

                <i class="bi bi-arrow-left me-2"></i>

                Back

            </a>

        </div>


        <!-- Versions -->
        <div class="row g-4"
             th:if="${!versions.empty}">

            <section class="col-lg-6"
                     th:each="version : ${versions}">

                <article class="surface-card h-100">


                    <!-- Card Header -->
                    <div class="card-header d-flex justify-content-between">

                        <div>

                            <h2 class="h5 mb-1"
                                th:text="'Version ' + ${version.versionNumber}">
                                Version
                            </h2>

                            <p class="page-subtitle mb-0"
                               th:text="${#temporals.format(version.approvedAt,'dd MMM yyyy, HH:mm')}">
                            </p>

                        </div>

                        <span class="status-badge status-approved">
                            Approved
                        </span>

                    </div>


                    <!-- Card Body -->
                    <div class="card-body">

                        <div class="review-media">


                            <!-- ================================================= -->
                            <!-- Profile Photo -->
                            <!-- ================================================= -->

                            <div>

                                <p class="form-label">
                                    Profile photo
                                </p>

                                <div class="media-panel">

                                    <img class="review-image"
                                         th:src="@{'/uploads/' + ${version.photoPath}}"
                                         alt="Approved profile photo">

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- Employee Signature -->
                            <!-- ================================================= -->

                            <div>

                                <p class="form-label">
                                    Signature
                                </p>

                                <div class="media-panel">

                                    <img class="signature-image"
                                         th:src="@{'/uploads/' + ${version.signaturePath}}"
                                         alt="Approved signature">

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- Foreign Signature -->
                            <!-- ================================================= -->

                            <div th:if="${version.foreignSignaturePath != null
                                         and !#strings.isEmpty(version.foreignSignaturePath)}">

                                <p class="form-label">
                                    Foreign Signature
                                </p>

                                <div class="media-panel">

                                    <img class="signature-image"
                                         th:src="@{'/uploads/' + ${version.foreignSignaturePath}}"
                                         alt="Approved foreign signature">

                                </div>

                            </div>


                            <!-- ================================================= -->
                            <!-- No Foreign Signature -->
                            <!-- ================================================= -->

                            <div th:unless="${version.foreignSignaturePath != null
                                             and !#strings.isEmpty(version.foreignSignaturePath)}">

                                <p class="form-label">
                                    Foreign Signature
                                </p>

                                <div class="media-panel d-flex align-items-center justify-content-center">

                                    <span class="text-muted">
                                        N/A
                                    </span>

                                </div>

                            </div>


                        </div>

                    </div>

                </article>

            </section>

        </div>


        <!-- Empty State -->
        <section class="surface-card"
                 th:if="${versions.empty}">

            <div class="empty-state">

                <i class="bi bi-clock-history"></i>

                No version history is available yet.

            </div>

        </section>

    </div>

</main>


<footer th:replace="~{fragments/layout :: footer}"></footer>

<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
