<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Signature Match Preview')}"></head><body><header th:replace="~{fragments/navbar :: navbar('PD')}"></header><main class="app-main" style="margin-left:0"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Before submission</span><h1 class="page-title">Signature match preview</h1></div></div><section class="surface-card"><div class="card-body"><p><strong th:text="${preview.batch.matchedFiles}"></strong> matched; <strong th:text="${preview.batch.invalidFiles}"></strong> unmatched or invalid.</p><ul><li th:each="error:${preview.errors}" class="text-danger" th:text="${error}"></li></ul><table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Version</th></tr></thead><tbody><tr th:each="row:${preview.matched}"><td th:text="${row.employeeNumber}"></td><td th:text="${row.signatureType}"></td><td th:text="${row.versionNumber}"></td></tr></tbody></table><form th:if="${preview.batch.invalidFiles == 0}" method="post" th:action="@{/pd/signatures/bulk/{id}/submit(id=${preview.batch.id})}"><button class="btn btn-bank">Submit matched files to DGM</button></form><a class="btn btn-soft" th:href="@{/pd/signatures}">Correct and re-upload</a></div></section></div></main></body></html>
