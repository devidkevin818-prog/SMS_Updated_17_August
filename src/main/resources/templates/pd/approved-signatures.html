<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Approved Signatures')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('PD')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('PD','approved-signatures')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div class="page-header d-flex justify-content-between align-items-start">
            <div>
                <span class="page-eyebrow">Approved Records</span>
                <h1 class="page-title">
                    Employee photos and signatures
                </h1>
                <p class="page-subtitle">
                    Only GM-approved employee photos and specimen signatures are shown here.
                </p>
            </div>
            <div>
                <a class="btn btn-bank"
                   th:href="@{/pd/approved-signatures/pdf}">
                    <i class="bi bi-file-earmark-pdf me-2"></i>
                    Download PDF
                </a>
            </div>
        </div>
        <section class="search-panel">
            <form class="row g-2" method="get" th:action="@{/pd/approved-signatures}">
                <div class="col"><input class="form-control" name="query" th:value="${query}"
                                        placeholder="Employee code or name"></div>
                <div class="col-auto">
                    <button class="btn btn-bank"><i class="bi bi-search me-2"></i>Search</button>
                </div>
            </form>
        </section>
        <section class="surface-card table-card">
            <div class="table-responsive">
                <table class="table app-table align-middle">
                    <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Approved photo</th>
                        <th>Approved signature</th>
                        <th>Branch</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="employee:${employees.content}">
                        <td><strong th:text="${employee.fullName}"></strong>
                            <div class="form-hint" th:text="${employee.employeeNumber}"></div>
                        </td>
                        <td><img class="approved-photo-thumbnail" th:src="@{'/uploads/'+${employee.photoPath}}"
                                 alt="Approved employee photo"></td>
                        <td><img class="approved-signature-thumbnail" th:src="@{'/uploads/'+${employee.signaturePath}}"
                                 alt="Approved employee signature"></td>
                        <td th:text="${employee.branchCode}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-soft"
                                                th:href="@{/pd/approved-signatures/{id}(id=${employee.id})}">View
                            profile</a></td>
                    </tr>
                    <tr th:if="${employees.empty}">
                        <td class="empty-state" colspan="5"><i class="bi bi-person-x"></i>No approved employee found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
