<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Edit User')}">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','users')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div th:replace="~{fragments/layout :: messages}"></div>
        <div class="page-header">
            <div><span class="page-eyebrow">Access Control</span>
                <h1 class="page-title" th:text="'Edit user: ' + ${user.username}">Edit user</h1>
                <p class="page-subtitle">Update account details, role, status, or branch assignment.</p></div>
            <div class="d-flex gap-2"><a class="btn btn-outline-warning" th:href="@{/admin/users/{id}/reset-password(id=${user.id})}">
                <i class="bi bi-key-fill me-2"></i>Reset password</a>
                <a class="btn btn-soft" th:href="@{/admin/users}"><i class="bi bi-arrow-left me-2"></i>Employees</a></div></div>
        <div class="surface-card mx-auto form-card-narrow">
            <div class="card-header"><h2 class="h5 mb-1"><i class="bi bi-person-gear text-success me-2"></i>Account
                information</h2>
                <p class="page-subtitle mb-0">Username cannot be changed</p></div>
            <div class="card-body">
                <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${userUpdateForm}" method="post">
                    <div class="alert alert-danger app-alert" th:if="${#fields.hasAnyErrors()}"><i
                            class="bi bi-exclamation-triangle-fill"></i>
                        <div th:each="error:${#fields.allErrors()}" th:text="${error}"></div>
                    </div>
                    <div class="mb-3"><label class="form-label">Username</label>
                        <input class="form-control"
                               th:value="${user.username}"
                               disabled></div>
                    <div class="mb-3"><label class="form-label" for="employeeNumber">Employee ID</label>
                        <div class="input-group"><span class="input-group-text">UB_PLC</span><input
                                class="form-control" id="employeeNumber" th:field="*{employeeNumber}"
                                inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"
                                placeholder="000001" title="Enter exactly 6 digits"></div></div>
                    <div class="mb-3"><label class="form-label" for="fullName">Full name</label><input
                            class="form-control" id="fullName" th:field="*{fullName}" required></div>


                    <div class="mb-3">
                        <label class="form-label" for="branchId">Branch</label>
                        <select class="form-select"
                                id="branchId"
                                th:field="*{branchId}"
                                required>
                            <option value="">Select Branch</option>
                            <option th:each="branch : ${branches}"
                                    th:value="${branch.branchId}"
                                    th:text="${branch.branchName}">
                            </option>
                        </select>
                    </div>


                    <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control"
                                                                                                id="email" type="email"
                                                                                                th:field="*{email}"
                                                                                                required></div>
                    <div class="mb-3"><label class="form-label" for="roleName">Role</label><select class="form-select"
                                                                                                   id="roleName"
                                                                                                   th:field="*{roleName}"
                                                                                                   required>
                        <option th:each="role:${roles}" th:value="${role.name}" th:text="${role.name}"></option>
                    </select></div>
                    <div class="mb-3"><label class="form-label" for="signatureScope">Signature visibility</label><select class="form-select" id="signatureScope" th:field="*{signatureScope}" required><option value="LOCAL">Local only</option><option value="FOREIGN">Foreign only</option><option value="BOTH">Local and foreign</option></select></div>
                    <div class="form-check form-switch mb-4"><input class="form-check-input" id="active" type="checkbox"
                                                                    th:field="*{active}"><label class="form-check-label"
                                                                                                for="active">Account is
                        active</label></div>
                    <button class="btn btn-bank" type="submit"><i class="bi bi-check-lg me-2"></i>Save user changes
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
