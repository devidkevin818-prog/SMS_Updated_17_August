<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Book Access')}"></head><body><header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','books')}"></aside><main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Admin access control</span><h1 class="page-title" th:text="${book.bookNumber}"></h1></div><a class="btn btn-soft" th:href="@{/books/{id}(id=${book.id})}">View book</a></div><div th:replace="~{fragments/layout :: messages}"></div>
<div class="row g-4"><div class="col-md-6"><section class="surface-card"><div class="card-header"><h2 class="h5">Grant user</h2></div><div class="card-body"><form method="post"><select class="form-select mb-2" name="userId" required><option value="">Select user</option><option th:each="u:${users}" th:value="${u.id}" th:text="${u.username+' - '+u.fullName}"></option></select><button class="btn btn-bank">Grant</button></form></div></section></div><div class="col-md-6"><section class="surface-card"><div class="card-header"><h2 class="h5">Grant role</h2></div><div class="card-body"><form method="post"><select class="form-select mb-2" name="roleId" required><option value="">Select role</option><option th:each="r:${roles}" th:value="${r.id}" th:text="${r.name}"></option></select><button class="btn btn-bank">Grant</button></form></div></section></div></div>
<section class="surface-card mt-4"><div class="table-responsive"><table class="table"><thead><tr><th>Subject</th><th>Granted by</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="g:${grants}"><td th:text="${g.user!=null?g.user.username:g.role.name}"></td><td th:text="${g.grantedBy.username}"></td><td th:text="${g.active?'Active':'Revoked'}"></td><td><form method="post"><input type="hidden" th:name="${g.user!=null?'userId':'roleId'}" th:value="${g.user!=null?g.user.id:g.role.id}"><input type="hidden" name="enabled" th:value="${!g.active}"><button class="btn btn-sm btn-outline-warning" th:text="${g.active?'Revoke':'Restore'}"></button></form></td></tr></tbody></table></div></section><form class="mt-4" method="post" th:action="@{/admin/books/{id}/deactivate(id=${book.id})}"><button class="btn btn-outline-danger">Deactivate book (retain history)</button></form></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
