<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Permissions')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','permissions')}"></aside>
<main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Access control</span><h1 class="page-title">Roles and permissions</h1><p class="page-subtitle">Central control for module access and hierarchy ordering.</p></div></div><div th:replace="~{fragments/layout :: messages}"></div>
<div class="row g-4"><div class="col-lg-4"><section class="surface-card"><div class="card-header"><h2 class="h5">Role hierarchy</h2></div><div class="card-body"><div th:each="role:${roles}" class="border-bottom py-2"><form method="post" th:action="@{/admin/permissions/roles/{id}/hierarchy(id=${role.id})}" class="d-flex align-items-center gap-2"><strong class="flex-grow-1" th:text="${role.name}"></strong><input class="form-control form-control-sm" style="width:80px" type="number" min="1" name="hierarchyOrder" th:value="${role.hierarchyOrder}"><button class="btn btn-sm btn-soft">Save</button></form></div></div></section></div>
<div class="col-lg-8"><section class="surface-card"><div class="card-header d-flex justify-content-between"><h2 class="h5">Permission grants</h2><form method="get"><select class="form-select" name="roleId" onchange="this.form.submit()"><option th:each="role:${roles}" th:value="${role.id}" th:selected="${role.id==selectedRoleId}" th:text="${role.name}"></option></select></form></div><div class="card-body"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Permission</th><th>Description</th><th>Granted</th></tr></thead><tbody><tr th:each="permission:${permissions}"><td><code th:text="${permission.key}"></code></td><td th:text="${permission.description}"></td><td><form method="post" th:action="@{/admin/permissions/grant}"><input type="hidden" name="roleId" th:value="${selectedRoleId}"><input type="hidden" name="permissionId" th:value="${permission.id}"><input type="hidden" name="granted" th:value="${!permission.granted}"><button class="btn btn-sm" th:classappend="${permission.granted}?' btn-success':' btn-outline-secondary'" th:text="${permission.granted}?'Granted':'Not granted'"></button></form></td></tr></tbody></table></div></div></section></div></div>
<section class="surface-card mt-4"><div class="card-header d-flex justify-content-between align-items-center"><div><h2 class="h5 mb-1">Per-user overrides</h2><p class="page-subtitle mb-0">Inherit uses the selected user's role. Allow or deny takes precedence.</p></div><form method="get"><input type="hidden" name="roleId" th:value="${selectedRoleId}"><select class="form-select" name="userId" onchange="this.form.submit()"><option th:each="u:${users}" th:value="${u.id}" th:selected="${u.id==selectedUserId}" th:text="${u.username+' ('+u.roleName+')'+(u.active?'':' - inactive')}"></option></select></form></div>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Permission</th><th>Description</th><th>Override</th></tr></thead><tbody><tr th:each="permission:${userPermissions}"><td><code th:text="${permission.key}"></code></td><td th:text="${permission.description}"></td><td><form method="post" th:action="@{/admin/permissions/users/{id}/override(id=${selectedUserId})}" class="d-flex gap-2"><input type="hidden" name="permissionId" th:value="${permission.id}"><select class="form-select form-select-sm" name="mode"><option value="INHERIT" th:selected="${permission.overrideMode=='INHERIT'}">Inherit role</option><option value="ALLOW" th:selected="${permission.overrideMode=='ALLOW'}">Allow</option><option value="DENY" th:selected="${permission.overrideMode=='DENY'}">Deny</option></select><button class="btn btn-sm btn-soft">Save</button></form></td></tr></tbody></table></div></section>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
