<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Password Reset Successful')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','users')}"></aside>
<main class="app-main"><div class="content-wrap"><section class="surface-card reset-success-card mx-auto text-center">
    <div class="reset-success-icon"><i class="bi bi-check-lg"></i></div><h1 class="h3">Password Reset Successfully</h1>
    <p class="text-secondary">The password for <strong th:text="${user.fullName}"></strong> has been reset successfully.</p>
    <div class="success-user-id" th:text="${'User ID: ' + user.username}"></div>
    <div class="temporary-password-result" th:if="${temporaryPassword != null}"><label class="form-label" for="temporaryPasswordResult">Temporary Password</label>
        <div class="input-group"><input class="form-control secure-password-output" id="temporaryPasswordResult" th:value="${temporaryPassword}" readonly autocomplete="off">
            <button class="btn btn-soft" type="button" onclick="copyPassword('temporaryPasswordResult', this)"><i class="bi bi-copy me-1"></i>Copy</button></div>
        <small><i class="bi bi-exclamation-triangle-fill"></i> This password is shown only on this page.</small></div>
    <p class="form-hint" th:if="${passwordChangeRequired}">The employee must change this password at the next login.</p>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-4"><a class="btn btn-soft" th:href="@{/admin/users}">Back to Employees</a>
        <a class="btn btn-bank" th:href="@{/admin/users/{id}/edit(id=${user.id})}">Done</a></div>
</section></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/reset-password.js}"></script></body></html>
