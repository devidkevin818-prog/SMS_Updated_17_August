<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('User Management')}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','users')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div class="page-header">
            <div><span class="page-eyebrow">Access Control</span>
                <h1 class="page-title">User management</h1>
                <p class="page-subtitle">Create authorized accounts and control active access.</p></div>
            <span class="status-badge status-active"><i class="bi bi-people-fill me-1"></i><span
                    th:text="${users.totalElements} + ' users'">0 users</span></span></div>
        <div th:replace="~{fragments/layout :: messages}"></div>
        <div class="row g-4">
            <section class="col-xl-4">
                <div class="surface-card">
                    <div class="card-header"><h2 class="h5 mb-1"><i
                            class="bi bi-person-plus-fill text-success me-2"></i>Create user</h2>
                        <p class="page-subtitle mb-0">Assign one role per account</p></div>
                    <div class="card-body">
                        <form th:action="@{/admin/users}" th:object="${userForm}" method="post">
                            <div class="alert alert-danger app-alert" th:if="${#fields.hasAnyErrors()}"><i
                                    class="bi bi-exclamation-triangle-fill"></i>
                                <div>
                                    <div th:each="error:${#fields.allErrors()}" th:text="${error}"></div>
                                </div>
                            </div>
                            <div class="mb-3"><label class="form-label" for="username">Username</label><input
                                    class="form-control" id="username" th:field="*{username}" placeholder="e.g. pd01"
                                    required></div>
                            <div class="mb-3"><label class="form-label" for="fullName">Full name</label><input
                                    class="form-control" id="fullName" th:field="*{fullName}"
                                    placeholder="Employee full name" required></div>
                            <div class="mb-3"><label class="form-label" for="email">Email address</label><input
                                    class="form-control" id="email" type="email" th:field="*{email}"
                                    placeholder="name@uttarabank-bd.com" required></div>
                            <div class="mb-3">
                                <label class="form-label" for="branchId">Branch name</label>

                                <select  th:field="*{branchId}" id="branchId" class="form-select">
                                    <option value="">Select Branch</option>

                                    <option th:each="branch : ${branches}"
                                            th:value="${branch.branchId}"
                                            th:text="${branch.branchName}">
                                    </option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="newPassword">
                                    Temporary password
                                </label>

                                <div class="position-relative">
                                    <input class="form-control pe-5"
                                           id="newPassword"
                                           type="password"
                                           th:field="*{password}"
                                           placeholder="Minimum 8 characters"
                                           required>

                                    <button type="button"
                                            class="position-absolute top-50 end-0 translate-middle-y
                       border-0 bg-transparent px-3"
                                            onclick="togglePassword('newPassword', 'passwordIcon')">
                                        <i class="bi bi-eye" id="passwordIcon"></i>
                                    </button>
                                </div>
                            </div>

                            <div class="mb-4"><label class="form-label" for="roleName">System role</label><select
                                    class="form-select" id="roleName" th:field="*{roleName}" required>
                                <option value="">Select a role</option>
                                <option th:each="role:${roles}" th:value="${role.name}" th:text="${role.name}"></option>
                            </select></div>
                            <button class="btn btn-bank w-100" type="submit"><i
                                    class="bi bi-person-check-fill me-2"></i>Create user
                            </button>
                        </form>
                    </div>
                </div>
            </section>
            <section class="col-xl-8">
                <div class="surface-card table-card">
                    <div class="card-header"><h2 class="h5 mb-1">Authorized accounts</h2>
                        <p class="page-subtitle mb-0">Edit details or control system access</p></div>
                    <div class="table-responsive">
                        <table class="table app-table table-hover">
                            <thead>
                            <tr>
                                <th>Username</th>
                                <th>Name</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user:${users.content}">
                                <td><strong th:text="${user.username}"></strong></td>
                                <td><span th:text="${user.fullName}"></span><small class="d-block text-secondary"
                                                                                   th:text="${user.email}"></small></td>
                                <td><span class="status-badge status-pending" th:text="${user.role.name}"></span></td>
                                <td><span class="status-badge"
                                          th:classappend="${user.active ? ' status-active':' status-inactive'}"
                                          th:text="${user.active ? 'Active':'Inactive'}"></span></td>
                                <td class="text-end">
                                    <div class="d-flex justify-content-end gap-2"><a
                                            class="btn btn-sm btn-outline-warning"
                                            th:href="@{/admin/users/{id}/edit(id=${user.id})}"><i
                                            class="bi bi-pencil-fill me-1"></i>Edit</a>
                                        <form th:action="@{/admin/users/{id}/toggle(id=${user.id})}" method="post">
                                            <button class="btn btn-sm"
                                                    th:classappend="${user.active ? ' btn-outline-danger':' btn-bank'}"
                                                    type="submit"><i class="bi me-1"
                                                                     th:classappend="${user.active ? 'bi-person-x-fill':'bi-person-check-fill'}"></i><span
                                                    th:text="${user.active ? 'Deactivate':'Activate'}"></span></button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${users.empty}">
                                <td class="empty-state" colspan="5"><i class="bi bi-people"></i>No users available.</td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
