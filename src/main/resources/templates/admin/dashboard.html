<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Admin Dashboard')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','dashboard')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div class="dashboard-toolbar">
            <a class="btn btn-bank" th:href="@{/admin/users}"><i class="bi bi-person-plus-fill me-2"></i>Create user</a>
        </div>
        <section class="metric-grid queue-menu-grid" aria-label="User management menu">
            <a class="metric-card text-decoration-none" th:href="@{/admin/users}"><span class="metric-icon"><i class="bi bi-people-fill"></i></span><strong class="metric-value" th:text="${totalUsers}">0</strong><span class="metric-label">All users</span></a>
            <a class="metric-card text-decoration-none" th:href="@{/admin/users(status='active')}"><span class="metric-icon"><i class="bi bi-person-check-fill"></i></span><strong class="metric-value" th:text="${activeUsers}">0</strong><span class="metric-label">Active users</span></a>
            <a class="metric-card text-decoration-none" th:href="@{/admin/users(status='inactive')}"><span class="metric-icon"><i class="bi bi-person-dash-fill"></i></span><strong class="metric-value" th:text="${inactiveUsers}">0</strong><span class="metric-label">Inactive users</span></a>
            <a class="metric-card text-decoration-none" th:href="@{/admin/users}"><span class="metric-icon"><i class="bi bi-shield-lock-fill"></i></span><strong class="metric-value" th:text="${roleCount}">0</strong><span class="metric-label">Access roles</span></a>
        </section>
        <section class="surface-card">
            <div class="card-header"><h2 class="h5 mb-1">Quick actions</h2>
                <p class="page-subtitle mb-0">Common administration tasks</p></div>
            <div class="card-body">
                <div class="quick-actions"><a class="quick-action" th:href="@{/admin/users}"><i
                        class="bi bi-person-plus-fill"></i><span><strong>Create user</strong><small>Add a role-based account</small></span></a><a
                        class="quick-action" th:href="@{/admin/users}"><i class="bi bi-people-fill"></i><span><strong>User management</strong><small>Review or change account status</small></span></a>
                </div>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
