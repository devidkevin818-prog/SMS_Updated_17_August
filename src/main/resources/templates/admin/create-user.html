<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Create User')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('ADMIN')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('ADMIN','users')}"></aside>
<main class="app-main"><div class="content-wrap">
    <div class="page-header"><div><span class="page-eyebrow">Access Control</span><h1 class="page-title">Create user</h1>
        <p class="page-subtitle">Create an authorized account with a temporary password.</p></div>
        <a class="btn btn-soft" th:href="@{/admin/users}"><i class="bi bi-arrow-left me-2"></i>Authorized users</a></div>
    <div class="surface-card mx-auto form-card-narrow"><div class="card-body">
        <form th:action="@{/admin/users}" th:object="${userForm}" method="post">
            <div class="alert alert-danger app-alert" th:if="${#fields.hasAnyErrors()}">
                <i class="bi bi-exclamation-triangle-fill"></i><div th:each="error:${#fields.allErrors()}" th:text="${error}"></div></div>
            <div class="mb-3"><label class="form-label" for="employeeNumber">Employee ID</label>
                <div class="input-group"><span class="input-group-text">UB_PLC</span>
                    <input class="form-control" id="employeeNumber" th:field="*{employeeNumber}"
                           inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6"
                           placeholder="000001" title="Enter exactly 6 digits" required></div></div>
            <div class="mb-3"><label class="form-label" for="username">Username</label>
                <input class="form-control" id="username" th:field="*{username}" maxlength="50" required></div>
            <div class="mb-3"><label class="form-label" for="fullName">Full name</label>
                <input class="form-control" id="fullName" th:field="*{fullName}" maxlength="100" required></div>
            <div class="mb-3"><label class="form-label" for="email">Email</label>
                <input class="form-control" id="email" type="email" th:field="*{email}" maxlength="100" required></div>
            <div class="mb-3"><label class="form-label" for="branchId">Branch</label><select class="form-select" id="branchId" th:field="*{branchId}" required>
                <option value="">Select branch</option><option th:each="branch:${branches}" th:value="${branch.branchId}" th:text="${branch.branchName}"></option></select></div>
            <div class="mb-3"><label class="form-label" for="roleName">Role</label><select class="form-select" id="roleName" th:field="*{roleName}" required>
                <option value="">Select role</option><option th:each="role:${roles}" th:value="${role.name}" th:text="${role.name}"></option></select></div>
            <div class="mb-4"><label class="form-label" for="password">Temporary password</label>
                <input class="form-control" id="password" type="password" th:field="*{password}" minlength="8" autocomplete="new-password" required>
                <small class="form-hint">The user must change this password after login.</small></div>
            <button class="btn btn-bank" type="submit"><i class="bi bi-person-check-fill me-2"></i>Create user</button>
        </form>
    </div></div>
</div></main>
<footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div>
</body></html>
