<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Audit Log')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar(${auditRole})}"></header><aside th:replace="~{fragments/sidebar :: sidebar(${auditRole},'audit')}"></aside>
<main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Security</span><h1 class="page-title">Immutable audit log</h1><p class="page-subtitle">Append-only record of system access and changes.</p></div></div>
<section class="surface-card"><div class="card-body"><form class="row g-2 mb-4"><div class="col-md-5"><input class="form-control" name="query" th:value="${query}" placeholder="User, entity, or target ID"></div><div class="col-md-4"><input class="form-control" name="action" th:value="${action}" placeholder="Action, e.g. VIEW"></div><div class="col-md-3"><button class="btn btn-bank">Search</button></div></form>
<div class="table-responsive"><table class="table align-middle"><thead><tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Target</th><th>IP</th><th>Result</th></tr></thead><tbody><tr th:each="log:${logs.content}"><td th:text="${log.eventTime}"></td><td th:text="${log.username?:'System'}"></td><td th:text="${log.actionType}"></td><td th:text="${log.targetEntity+' '+(log.targetId?:'')}"></td><td th:text="${log.ipAddress}"></td><td th:text="${log.result}"></td></tr></tbody></table></div></div></section>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
