<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Employee Directory')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar(${currentRole})}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar(${currentRole},'directory')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div class="page-header">
            <div><span class="page-eyebrow">Approved Directory</span>
                <h1 class="page-title">Employee cards</h1>
                <p class="page-subtitle">Available to every authorized application user.</p></div>
            <span class="status-badge status-active"><i class="bi bi-shield-check me-1"></i>Verified records</span>
        </div>
        <section class="search-panel">
            <form class="directory-filter-grid" method="get" th:action="@{/employees}">
                <div class="directory-filter-search">
                    <label class="form-label" for="employeeQuery">Employee</label>
                    <div class="input-icon-group"><i class="bi bi-search"></i><input class="form-control" name="query"
                                                                                     id="employeeQuery"
                                                                                     th:value="${query}"
                                                                                     placeholder="Search employee code or name"
                                                                                     aria-label="Search employee"></div>
                </div>
                <div><label class="form-label" for="departmentId">Department</label><select class="form-select" id="departmentId" name="departmentId"><option value="">All departments</option><option th:each="item:${departments}" th:value="${item.departmentId}" th:text="${item.departmentName}" th:selected="${item.departmentId == departmentId}"></option></select></div>
                <div><label class="form-label" for="designationId">Designation</label><select class="form-select" id="designationId" name="designationId"><option value="">All designations</option><option th:each="item:${designations}" th:value="${item.designationId}" th:text="${item.designationName}" th:selected="${item.designationId == designationId}"></option></select></div>
                <div><label class="form-label" for="branchId">Branch</label><select class="form-select" id="branchId" name="branchId"><option value="">All branches</option><option th:each="item:${branches}" th:value="${item.branchId}" th:text="${item.branchName}" th:selected="${item.branchId == branchId}"></option></select></div>
                <div class="directory-filter-actions d-flex gap-2">
                    <a class="btn btn-soft" th:href="@{/employees}">Clear</a>
                    <button class="btn btn-bank" type="submit"><i class="bi bi-funnel-fill me-2"></i>Apply filters</button>
                </div>
            </form>
        </section>
        <section class="surface-card table-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div><h2 class="h5 mb-1">Approved employees</h2>
                    <p class="page-subtitle mb-0">Open a record to view its official card</p></div>
                <span class="status-badge status-approved" th:text="${employees.totalElements} + ' employee(s)'">0 employees</span>
            </div>
            <div class="table-responsive">
                <table class="table app-table table-hover">
                    <thead>
                    <tr>
                        <th>Employee code</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Department</th>
                        <th>Branch</th>
                        <th class="text-end">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="employee:${employees.content}">
                        <td><strong th:text="${employee.employeeNumber}"></strong></td>
                        <td th:text="${employee.fullName}"></td>
                        <td th:text="${employee.designation.designationName}"></td>
                        <td th:text="${employee.department.departmentName}"></td>
                        <td th:text="${employee.branch.branchName}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-primary"
                                                th:href="@{/employees/{id}(id=${employee.id})}"><i
                                class="bi bi-person-vcard-fill me-1"></i>View card</a></td>
                    </tr>
                    <tr th:if="${employees.empty}">
                        <td class="empty-state" colspan="6"><i class="bi bi-person-x"></i>No approved employee found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <nav class="mt-3" th:if="${employees.totalPages > 1}" aria-label="Employee directory pages"><ul class="pagination justify-content-center"><li class="page-item" th:classappend="${employees.first}?' disabled'"><a class="page-link" th:href="@{/employees(query=${query},departmentId=${departmentId},designationId=${designationId},branchId=${branchId},page=${employees.number-1})}">Previous</a></li><li class="page-item" th:each="pageNo:${#numbers.sequence(0,employees.totalPages-1)}" th:classappend="${pageNo == employees.number}?' active'"><a class="page-link" th:href="@{/employees(query=${query},departmentId=${departmentId},designationId=${designationId},branchId=${branchId},page=${pageNo})}" th:text="${pageNo+1}"></a></li><li class="page-item" th:classappend="${employees.last}?' disabled'"><a class="page-link" th:href="@{/employees(query=${query},departmentId=${departmentId},designationId=${designationId},branchId=${branchId},page=${employees.number+1})}">Next</a></li></ul></nav>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
