<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="messages" class="alert-stack">
    <div class="alert alert-success app-alert" role="alert" th:if="${success}"><i class="bi bi-check-circle-fill"></i><span th:text="${success}"></span></div>
    <div class="alert alert-danger app-alert" role="alert" th:if="${error}"><i class="bi bi-exclamation-triangle-fill"></i><span th:text="${error}"></span></div>
</div>
<footer th:fragment="footer" class="app-footer"><span>&copy; 2026 Uttara Bank PLC</span><span>Employee Signature Management System</span></footer>
<div th:fragment="scripts">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</div>
</body>
</html>
