<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Signature Approvals')}"></head><body><header th:replace="~{fragments/navbar :: navbar(${level})}"></header><main class="app-main" style="margin-left:0"><div class="content-wrap"><h1 class="page-title">Signature approval inbox</h1><table class="table"><thead><tr><th>Employee</th><th>Type</th><th>Version</th><th>Decision</th></tr></thead><tbody><tr th:each="row:${requests}"><td th:text="${row.employeeNumber}"></td><td th:text="${row.signatureType}"></td><td th:text="${row.versionNumber}"></td><td><form method="post" th:action="@{/{level}/signature-requests/{id}/decision(level=${level.toLowerCase()},id=${row.id})}"><input class="form-control mb-1" name="remarks" placeholder="Remarks (required for rejection)"><button class="btn btn-sm btn-success" name="action" value="APPROVE">Approve</button><button class="btn btn-sm btn-danger" name="action" value="REJECT">Reject</button></form></td></tr></tbody></table></div></main></body></html>
