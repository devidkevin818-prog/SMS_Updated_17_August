<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Change Password')}">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <section class="surface-card">
                <div class="card-header"><span class="page-eyebrow">First Login Security</span>
                    <h1 class="h3 mb-1">Change your password</h1>
                    <p class="page-subtitle mb-0">You must choose a private password before using the system.</p></div>
                <div class="card-body">
                    <form th:action="@{/account/change-password}" th:object="${passwordChangeForm}" method="post">
                        <div class="alert alert-danger app-alert" th:if="${#fields.hasAnyErrors()}">
                            <div th:each="error:${#fields.allErrors()}" th:text="${error}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="currentPassword">
                                Current password
                            </label>

                            <div class="position-relative">
                                <input class="form-control pe-5"
                                       id="currentPassword"
                                       type="password"
                                       th:field="*{currentPassword}"
                                       autocomplete="current-password"
                                       required>

                                <button type="button"
                                        class="position-absolute top-50 end-0 translate-middle-y
                       border-0 bg-transparent px-3"
                                        onclick="togglePassword('currentPassword', 'currentPasswordIcon')">
                                    <i class="bi bi-eye" id="currentPasswordIcon"></i>
                                </button>
                            </div>
                        </div>


                        <div class="mb-3">
                            <label class="form-label" for="newPassword">
                                New password
                            </label>

                            <div class="position-relative">
                                <input class="form-control pe-5"
                                       id="newPassword"
                                       type="password"
                                       th:field="*{newPassword}"
                                       minlength="8"
                                       autocomplete="new-password"
                                       required>

                                <button type="button"
                                        class="position-absolute top-50 end-0 translate-middle-y
                       border-0 bg-transparent px-3"
                                        onclick="togglePassword('newPassword', 'newPasswordIcon')">
                                    <i class="bi bi-eye" id="newPasswordIcon"></i>
                                </button>
                            </div>

                            <small class="form-hint">
                                Use at least 8 characters.
                            </small>
                        </div>


                        <div class="mb-4">
                            <label class="form-label" for="confirmPassword">
                                Confirm new password
                            </label>

                            <div class="position-relative">
                                <input class="form-control pe-5"
                                       id="confirmPassword"
                                       type="password"
                                       th:field="*{confirmPassword}"
                                       minlength="8"
                                       autocomplete="new-password"
                                       required>

                                <button type="button"
                                        class="position-absolute top-50 end-0 translate-middle-y
                       border-0 bg-transparent px-3"
                                        onclick="togglePassword('confirmPassword', 'confirmPasswordIcon')">
                                    <i class="bi bi-eye" id="confirmPasswordIcon"></i>
                                </button>
                            </div>
                        </div>
                        <button class="btn btn-bank w-100" type="submit"><i class="bi bi-shield-lock-fill me-2"></i>Change
                            password
                        </button>
                    </form>
                    <form class="mt-3" th:action="@{/logout}" method="post">
                        <button class="btn btn-soft w-100" type="submit">Sign out</button>
                    </form>
                </div>
            </section>
        </div>
    </div>
</main>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script th:src="@{/js/password-toggle.js}"></script>
</body>
</html>
