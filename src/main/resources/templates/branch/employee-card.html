<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Employee Card')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('BRANCH')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('BRANCH','search')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <div class="page-header">
            <div><span class="page-eyebrow">Verified Employee</span>
                <h1 class="page-title">Official employee profile</h1>
                <p class="page-subtitle">GM-approved information and specimen signature.</p></div>
            <a class="btn btn-soft" th:href="@{/branch/dashboard}"><i class="bi bi-arrow-left me-2"></i>Back to
                search</a></div>
        <article class="employee-id-card">
            <header class="id-card-header">
                <div class="id-bank-brand"><img th:src="@{/css/images/uttara-bank-limited-seeklogo.png}"
                                                alt="Uttara Bank Limited"></div>
                <span class="id-card-mark"><i class="bi bi-patch-check-fill me-1"></i>Verified profile</span></header>
            <div class="id-card-body">
                <div class="employee-photo-wrap" th:if="${employee.photoPath != null}"><img class="employee-photo"
                                                      th:src="@{'/media/'+${employee.photoPath}}"
                                                      alt="Employee photo"></div>
                <section><h2 class="employee-name" th:text="${employee.fullName}"></h2>
                    <div class="employee-designation" th:text="${employee.designation.designationName}"></div>
                    <table class="id-details">
                        <tr>
                            <th>Employee code</th>
                            <td th:text="${employee.employeeNumber}"></td>
                        </tr>
                        <tr>
                            <th>Department</th>
                            <td th:text="${employee.department.departmentName}"></td>
                        </tr>
                        <tr>
                            <th>Branch</th>
                            <td th:text="${employee.branch.branchName}"></td>
                        </tr>
                    </table>
                    <div class="signature-panel" th:if="${canViewLocal and employee.signaturePath != null}"><span>Approved local signature</span><img
                            th:src="@{'/media/'+${employee.signaturePath}}" alt="Approved local signature"></div>
                    <div class="signature-panel" th:if="${canViewForeign and employee.foreignSignaturePath != null}"><span>Approved foreign signature</span><img
                            th:src="@{'/media/'+${employee.foreignSignaturePath}}" alt="Approved foreign signature"></div>
                </section>
            </div>
            <footer class="id-card-footer"><span>Employee Signature Management System</span><span>Authorized internal use only</span>
            </footer>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
