<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Employee Search')}"></head>
<body>
<header th:replace="~{fragments/navbar :: navbar('BRANCH')}"></header>
<aside th:replace="~{fragments/sidebar :: sidebar('BRANCH','dashboard')}"></aside>
<main class="app-main">
    <div class="content-wrap">
        <section class="search-panel">
            <form class="branch-filter-grid" method="get" th:action="@{/branch/dashboard}">
                <div>
                    <div class="input-icon-group"><i class="bi bi-search"></i><input class="form-control" name="query"
                                                                                     th:value="${query}"
                                                                                     placeholder="Search employee code or name"
                                                                                     aria-label="Search employee"></div>
                </div>
                <div><select class="form-select" name="designationId" aria-label="Filter by designation"><option value="">All designations</option><option th:each="item:${designations}" th:value="${item.designationId}" th:text="${item.designationName}" th:selected="${item.designationId == designationId}"></option></select></div>
                <div><select class="form-select" name="branchId" aria-label="Filter by branch"><option value="">All branches</option><option th:each="item:${branches}" th:value="${item.branchId}" th:text="${item.branchName}" th:selected="${item.branchId == branchId}"></option></select></div>
                <div class="d-flex gap-2">
                    <a class="btn btn-soft" th:href="@{/branch/dashboard}">Clear</a>
                    <button class="btn btn-bank" type="submit"><i class="bi bi-search me-2"></i>Search</button>
                </div>
            </form>
        </section>
        <section class="surface-card table-card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <div><h2 class="h5 mb-1">Approved employees</h2>
                    <p class="page-subtitle mb-0">Only GM-approved records are available</p></div>
                <span class="status-badge status-approved"
                      th:text="${employees.totalElements} + ' result(s)'">0 results</span></div>
            <div class="table-responsive">
                <table class="table app-table table-hover">
                    <thead>
                    <tr>
                        <th>Employee code</th>
                        <th>Name</th>
                        <th>Designation</th>
                        <th>Branch</th>
                        <th class="text-end">Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="employee:${employees.content}">
                        <td><strong th:text="${employee.employeeNumber}"></strong></td>
                        <td th:text="${employee.fullName}"></td>
                        <td th:text="${employee.designation.designationName}"></td>
                        <td th:text="${employee.branch.branchName}"></td>
                        <td class="text-end"><a class="btn btn-sm btn-primary"
                                                th:href="@{/branch/employees/{id}(id=${employee.id})}"><i
                                class="bi bi-person-vcard-fill me-1"></i>View card</a></td>
                    </tr>
                    <tr th:if="${employees.empty}">
                        <td class="empty-state" colspan="5"><i class="bi bi-person-x"></i>No approved employee found.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
        <nav class="mt-3" th:if="${employees.totalPages > 1}" aria-label="Branch employee pages">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${employees.first} ? ' disabled'">
                    <a class="page-link" th:href="@{/branch/dashboard(query=${query},designationId=${designationId},branchId=${branchId},page=${employees.number-1})}">Previous</a>
                </li>
                <li class="page-item" th:each="pageNo:${#numbers.sequence(0,employees.totalPages-1)}"
                    th:classappend="${pageNo == employees.number} ? ' active'">
                    <a class="page-link" th:href="@{/branch/dashboard(query=${query},designationId=${designationId},branchId=${branchId},page=${pageNo})}"
                       th:text="${pageNo+1}"></a>
                </li>
                <li class="page-item" th:classappend="${employees.last} ? ' disabled'">
                    <a class="page-link" th:href="@{/branch/dashboard(query=${query},designationId=${designationId},branchId=${branchId},page=${employees.number+1})}">Next</a>
                </li>
            </ul>
        </nav>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
