<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/head :: head('Employee Search')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar('BRANCH')}"></header><aside th:replace="~{fragments/sidebar :: sidebar('BRANCH','search')}"></aside>
<main class="app-main"><div class="content-wrap"><div class="page-header"><div><span class="page-eyebrow">Branch Access</span><h1 class="page-title">Employee verification</h1><p class="page-subtitle">Search the approved directory by employee code or employee name.</p></div><span class="status-badge status-active"><i class="bi bi-eye-fill me-1"></i>Read only</span></div>
<section class="search-panel"><form class="row g-2 align-items-center" method="get" th:action="@{/branch/dashboard}"><div class="col"><div class="input-icon-group"><i class="bi bi-search"></i><input class="form-control" name="query" th:value="${query}" placeholder="Search employee code or name" aria-label="Search employee"></div></div><div class="col-auto"><button class="btn btn-bank" type="submit"><i class="bi bi-search me-2"></i>Search</button></div></form></section>
<section class="surface-card table-card"><div class="card-header d-flex justify-content-between align-items-center"><div><h2 class="h5 mb-1">Approved employees</h2><p class="page-subtitle mb-0">Only GM-approved records are available</p></div><span class="status-badge status-approved" th:text="${employees.totalElements} + ' result(s)'">0 results</span></div><div class="table-responsive"><table class="table app-table table-hover"><thead><tr><th>Employee code</th><th>Name</th><th>Designation</th><th>Branch</th><th class="text-end">Action</th></tr></thead><tbody><tr th:each="employee:${employees.content}"><td><strong th:text="${employee.employeeNumber}"></strong></td><td th:text="${employee.fullName}"></td><td th:text="${employee.designation}"></td><td th:text="${employee.branchCode}"></td><td class="text-end"><a class="btn btn-sm btn-primary" th:href="@{/branch/employees/{id}(id=${employee.id})}"><i class="bi bi-person-vcard-fill me-1"></i>View card</a></td></tr><tr th:if="${employees.empty}"><td class="empty-state" colspan="5"><i class="bi bi-person-x"></i>No approved employee found.</td></tr></tbody></table></div></section>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
