<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Signature Updates')}">
</head>

<body th:with="
        checkerRole=${level == 'DGM'
            or level == 'LEVEL_1_CHECKER'
            or level == 'Level 1 Checker'
            ? 'LEVEL_1_CHECKER'
            : 'LEVEL_2_CHECKER'},
        checkerRoute=${level == 'DGM'
            or level == 'LEVEL_1_CHECKER'
            or level == 'Level 1 Checker'
            ? 'dgm'
            : 'gm'}">

<header th:replace="~{fragments/navbar :: navbar(${checkerRole})}">
</header>

<aside th:replace="~{fragments/sidebar :: sidebar(${checkerRole}, 'signature-management')}">
</aside>

<main class="app-main">

    <div class="content-wrap">

        <div class="page-header">

            <div>

                <span class="page-eyebrow">
                    Controlled replacement
                </span>

                <h1 class="page-title">
                    Initiate signature update
                </h1>

                <p class="page-subtitle">
                    Only already-uploaded signature types can be initiated here.
                    Missing signatures are uploaded directly by the Maker.
                </p>

            </div>

        </div>

        <div th:replace="~{fragments/layout :: messages}">
        </div>

        <section class="search-panel">

            <form class="row g-2"
                  method="get"
                  th:action="@{/{level}/signature-management(level=${checkerRoute})}">

                <div class="col">

                    <input class="form-control"
                           name="query"
                           th:value="${query}"
                           placeholder="Employee ID or name">

                </div>

                <div class="col-auto">

                    <button class="btn btn-bank">
                        Search
                    </button>

                </div>

            </form>

        </section>

        <section class="surface-card table-card">

            <div class="table-responsive">

                <table class="table app-table">

                    <thead>

                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Local replacement</th>
                        <th>Foreign replacement</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="employee : ${employees.content}">

                        <td th:text="${employee.employeeNumber}">
                        </td>

                        <td th:text="${employee.fullName}">
                        </td>

                        <td>

                            <form th:if="${employee.signaturePath != null}"
                                  method="post"
                                  th:action="@{/{level}/employees/{id}/signature-change(
                                      level=${checkerRoute},
                                      id=${employee.id}
                                  )}">

                                <input type="hidden"
                                       name="type"
                                       value="LOCAL">

                                <input class="form-control form-control-sm mb-1"
                                       name="remarks"
                                       maxlength="500"
                                       placeholder="Mandatory remarks"
                                       required>

                                <button class="btn btn-sm btn-warning">
                                    Initiate local update
                                </button>

                            </form>

                            <span th:if="${employee.signaturePath == null}"
                                  class="text-muted">
                                Missing, Maker uploads directly
                            </span>

                        </td>

                        <td>

                            <form th:if="${employee.foreignSignaturePath != null}"
                                  method="post"
                                  th:action="@{/{level}/employees/{id}/signature-change(
                                      level=${checkerRoute},
                                      id=${employee.id}
                                  )}">

                                <input type="hidden"
                                       name="type"
                                       value="FOREIGN">

                                <input class="form-control form-control-sm mb-1"
                                       name="remarks"
                                       maxlength="500"
                                       placeholder="Mandatory remarks"
                                       required>

                                <button class="btn btn-sm btn-warning">
                                    Initiate foreign update
                                </button>

                            </form>

                            <span th:if="${employee.foreignSignaturePath == null}"
                                  class="text-muted">
                                Missing, Maker uploads directly
                            </span>

                        </td>

                    </tr>

                    <tr th:if="${employees.empty}">

                        <td colspan="4"
                            class="empty-state">
                            No employee found.
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </div>

</main>

<div th:replace="~{fragments/layout :: scripts}">
</div>

</body>
</html>
