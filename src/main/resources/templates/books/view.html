<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Signature Book')}"></head><body>
<header th:replace="~{fragments/navbar :: navbar(${role})}"></header><aside th:replace="~{fragments/sidebar :: sidebar(${role},'books')}"></aside>
<main class="app-main"><div class="content-wrap">
 <div class="page-header"><div><span class="page-eyebrow" th:text="${book.signatureType}"></span><h1 class="page-title" th:text="${book.bookNumber}"></h1><p class="page-subtitle"><span th:text="${book.status}"></span> · Generated <span th:text="${book.generatedAt}"></span></p></div><div class="d-flex gap-2"><a class="btn btn-soft" th:href="@{/books}">Back</a><a th:if="${canDownload}" class="btn btn-bank" th:href="@{/books/{id}/content(id=${book.id},download=true)}">Download</a><a th:if="${canManage}" class="btn btn-outline-secondary" th:href="@{/admin/books/{id}/access(id=${book.id})}">Manage access</a></div></div>
 <section class="surface-card mb-4"><div class="card-body"><form method="get" th:action="@{/books/{id}(id=${book.id})}" class="row g-2"><div class="col-md-9"><label class="form-label" for="bookEmployeeSearch">Search employee</label><input id="bookEmployeeSearch" class="form-control" name="query" th:value="${query}" placeholder="Employee ID or employee name"></div><div class="col-md-3 d-flex align-items-end gap-2"><button class="btn btn-bank flex-grow-1"><i class="bi bi-search me-1"></i>Search</button><a th:if="${!#strings.isEmpty(query)}" class="btn btn-soft" th:href="@{/books/{id}(id=${book.id})}">Clear</a></div></form></div></section>
 <section class="surface-card mb-4"><div class="card-header"><h2 class="h5 mb-0">Employee signatures</h2></div><div class="table-responsive"><table class="table app-table align-middle mb-0"><thead><tr><th>Serial</th><th>Employee ID</th><th>Name</th><th>Designation</th><th>Local signature</th><th>Foreign signature</th></tr></thead><tbody><tr th:each="employee:${employees}"><td th:text="${employee.serial}"></td><td th:text="${employee.employeeNumber}"></td><td th:text="${employee.name}"></td><td th:text="${employee.designation}"></td><td><img th:if="${employee.localId != null}" class="approved-signature-thumbnail" th:src="@{/books/{bookId}/entries/{entryId}/signature(bookId=${book.id},entryId=${employee.localId})}" alt="Local signature"><span th:if="${employee.localId == null}" class="text-muted">Not available</span></td><td><img th:if="${employee.foreignId != null}" class="approved-signature-thumbnail" th:src="@{/books/{bookId}/entries/{entryId}/signature(bookId=${book.id},entryId=${employee.foreignId})}" alt="Foreign signature"><span th:if="${employee.foreignId == null}" class="text-muted">Not available</span></td></tr><tr th:if="${#lists.isEmpty(employees)}"><td colspan="6" class="text-center text-muted py-4">No employee matches this search.</td></tr></tbody></table></div></section>
 <section class="surface-card"><div class="card-header"><h2 class="h5 mb-0">PDF preview</h2></div><object th:data="@{/books/{id}/content(id=${book.id})}" type="application/pdf" style="width:100%;height:75vh"><p>Your browser cannot display PDF files inline. <a th:if="${canDownload}" th:href="@{/books/{id}/content(id=${book.id},download=true)}">Download the PDF</a></p></object></section>
</div></main><footer th:replace="~{fragments/layout :: footer}"></footer><div th:replace="~{fragments/layout :: scripts}"></div></body></html>
